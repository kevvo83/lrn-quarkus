# Dev
quarkus.compose.devservices.files=compose-devservices.yml
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/postgres
quarkus.datasource.reactive.url=vertx-reactive:postgresql://localhost:5432/postgres

# Flyway owns schema changes; Hibernate checks that the schema matches the entities.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# Prod DB settings
#%prod.quarkus.datasource.username = hibernate
#%prod.quarkus.datasource.password = hibernate
#%prod.quarkus.datasource.reactive.url = vertx-reactive:postgresql://localhost/quarkus_test
#%prod.quarkus.hibernate-orm.schema-management.strategy = create

# JPA application-level settings
jpaTimeoutInSeconds=90
